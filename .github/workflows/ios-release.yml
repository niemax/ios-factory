name: iOS release (reusable)

# Called by a consuming app repo's own tag-triggered workflow, e.g.:
#
#   jobs:
#     release:
#       uses: niemax/ios-factory/.github/workflows/ios-release.yml@main
#       with:
#         project_dir: client        # dir containing project.yml / .xcodeproj, "." if at repo root
#         scheme: Roompiece
#         bundle_id: com.example.roompiece
#         team_id: ABCDE12345
#       secrets:
#         ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
#         ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
#         ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
#
# `secrets: inherit` looks tempting but is unreliable across repository
# boundaries (community-reported gotcha) — pass each secret explicitly.
#
# Stops at a successful TestFlight upload. Submitting the build for App
# Review is always a manual step in App Store Connect — never automated.

on:
  workflow_call:
    inputs:
      project_dir:
        description: "Directory (relative to the calling repo's root) containing project.yml / the .xcodeproj. Use '.' if the project lives at the repo root."
        required: true
        type: string
      scheme:
        description: "Xcode scheme to test and build"
        required: true
        type: string
      bundle_id:
        description: "App's bundle identifier"
        required: true
        type: string
      team_id:
        description: "Apple Developer Team ID"
        required: true
        type: string
    secrets:
      ASC_KEY_ID:
        description: "App Store Connect API Key ID"
        required: true
      ASC_ISSUER_ID:
        description: "App Store Connect API Key Issuer ID"
        required: true
      ASC_KEY_CONTENT:
        description: "App Store Connect API Key .p8 contents (raw, not base64)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Test, build, sign, and upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      - name: Check out ios-factory (Fastlane lane lives here)
        uses: actions/checkout@v4
        with:
          repository: niemax/ios-factory
          path: ios-factory-tools

      - name: Set up Ruby + bundle install
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios-factory-tools

      - name: Derive version from tag and run number
        id: version
        run: |
          echo "marketing_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run release lane
        working-directory: ios-factory-tools
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          # Two levels: fastlane itself chdirs into ios-factory-tools/fastlane/
          # before running the lane, on top of this step's own working-directory
          # (ios-factory-tools/) — so reaching the app repo's checkout needs
          # ../.. (out of fastlane/, out of ios-factory-tools/), then the app's
          # project_dir from there.
          bundle exec fastlane ios release \
            project_dir:"../../${{ inputs.project_dir }}" \
            scheme:"${{ inputs.scheme }}" \
            bundle_id:"${{ inputs.bundle_id }}" \
            team_id:"${{ inputs.team_id }}" \
            marketing_version:"${{ steps.version.outputs.marketing_version }}" \
            build_number:"${{ steps.version.outputs.build_number }}"
